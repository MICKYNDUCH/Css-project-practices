<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .red-circle {
      width: 200px;
      height: 200px;
      background-color: red;
      border-radius: 50%;
      margin-top: 150px;
      margin-left: 250px;
      position: absolute;
       /* Adjust to center vertically */
    }
    .blue-box {
      width: 500px;
      height: 300px;
      background-color: blue;
      margin-top: 200px;
      margin-left: 200px;
      position: relative;
      /* Adjust to center horizontally */
    }
    .white.circle {
      width: 100px;
      height: 100px;
      background-color: white;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .text {
      color: black;
      font-size: 20px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
      <div class="white circle">
        <div class="text"><p>black text</p></div>
      </div>
    </div>
  </div>

</body>

</html>
